name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full suite before publishing

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, curl
          coverage: pcov
          tools: composer:v2
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Security advisories (dev dependencies only; the shipped adapter has none)
        run: composer audit --abandoned=report
      - name: Fetch pinned FOSSBilling (checksum verified)
        run: dev/scripts/fetch-fossbilling.sh
      - run: vendor/bin/phpunit
      - if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  e2e:
    name: End-to-end (FOSSBilling 0.8.9 + mock OSIR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: make install
      - run: make e2e
      - run: make doctor
      - name: Container logs on failure
        if: failure()
        run: docker compose --project-directory dev -f dev/docker-compose.yml logs --no-color --tail=200
      - if: always()
        run: make clean

  clientfence:
    name: ClientFence build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, curl
          tools: composer:v2
      - name: Generate it, and fail if the word FOSSBilling survives
        run: dev/scripts/make-clientfence.sh --check
      - name: Every generated file parses
        run: find build/clientfence -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: The renames landed where they should
        run: |
          grep -q 'namespace ClientFence\\Mod\\Osir;' build/clientfence/modules/Osir/Service.php
          grep -q 'class Registrar_Adapter_Osir extends Registrar_AdapterAbstract implements Registrar_TldPrices, Registrar_TransferStatus' build/clientfence/library/Registrar/Adapter/Osir.php
          grep -q 'ClientFence.api.client.post' build/clientfence/modules/Osir/templates/client/mod_osir_dns.html.twig
          grep -rq 'namespace Osir\\ClientFence' build/clientfence/library   # our own namespace follows the platform
          grep -q 'Osir-Inc/clientfence-osir' build/clientfence/modules/Osir/manifest.json
          # the two interfaces are declared when the platform lacks them, or an older ClientFence
          # would fatal on the class declaration and lose the whole registrar
          grep -q "interface_exists('Registrar_TldPrices')" build/clientfence/library/Registrar/Adapter/Osir.php
          grep -q "interface_exists('Registrar_TransferStatus')" build/clientfence/library/Registrar/Adapter/Osir.php
      - name: The build loads on a ClientFence that has neither capability
        run: |
          cat > /tmp/older-clientfence.php <<'PHP'
          <?php
          // The least a fork must provide; the two capability interfaces are deliberately absent.
          abstract class Registrar_AdapterAbstract { public function __construct($options) {} }
          class Registrar_Domain {}
          require 'build/clientfence/library/Registrar/Adapter/Osir.php';
          $missing = array_values(array_filter(['getTldPrices', 'getTransferStatus'], fn (string $m): bool => !method_exists('Registrar_Adapter_Osir', $m)));
          echo $missing === [] ? "loads without the interfaces\n" : 'missing: ' . implode(', ', $missing) . "\n";
          exit($missing === [] ? 0 : 1);
          PHP
          php /tmp/older-clientfence.php
      - name: Both inline scripts carry the platform's script-policy nonce
        run: |
          for f in build/clientfence/modules/Osir/templates/admin/mod_osir_index.html.twig \
                   build/clientfence/modules/Osir/templates/client/mod_osir_dns.html.twig \
                   src/modules/Osir/templates/admin/mod_osir_index.html.twig \
                   src/modules/Osir/templates/client/mod_osir_dns.html.twig; do
            grep -q '<script{% if csp_nonce is defined %} nonce="{{ csp_nonce }}"{% endif %}>' "$f" \
              || { echo "$f has an inline script without the nonce: ClientFence's CSP would block it"; exit 1; }
          done

  package:
    name: Release package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dev/scripts/build-release.sh
      - name: The shipped zip contains exactly the adapter and module sources
        run: |
          mkdir -p /tmp/zip && python3 -m zipfile -e dist/osir-fossbilling-registrar-*.zip /tmp/zip
          diff -r --exclude=README.md --exclude=LICENSE --exclude=CHANGELOG.md --exclude=SECURITY.md \
            src/library /tmp/zip/library
          diff -r src/modules /tmp/zip/modules
          test "$(ls /tmp/zip)" = "$(printf 'library\nmodules')"
          mkdir -p /tmp/cf && python3 -m zipfile -e dist/osir-clientfence-registrar-*.zip /tmp/cf
          diff -r --exclude=README.md --exclude=LICENSE --exclude=CHANGELOG.md --exclude=SECURITY.md \
            build/clientfence/library /tmp/cf/library
          diff -r build/clientfence/modules /tmp/cf/modules
          test "$(ls /tmp/cf)" = "$(printf 'library\nmodules')"
          mkdir -p /tmp/theme && python3 -m zipfile -e dist/osir-fossbilling-theme-*.zip /tmp/theme
          diff -r --exclude=README.md --exclude=LICENSE theme/osir /tmp/theme/themes/osir
          test "$(ls /tmp/theme)" = "themes"
      - name: Build twice, expect identical bytes
        run: |
          first=$(cat dist/SHA256SUMS)
          dev/scripts/build-release.sh >/dev/null
          test "$first" = "$(cat dist/SHA256SUMS)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/
          retention-days: 14
