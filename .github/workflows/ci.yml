name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full suite before publishing

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, curl
          coverage: pcov
          tools: composer:v2
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Security advisories (dev dependencies only; the shipped adapter has none)
        run: composer audit --abandoned=report
      - name: Fetch pinned FOSSBilling (checksum verified)
        run: dev/scripts/fetch-fossbilling.sh
      - run: vendor/bin/phpunit
      - if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  e2e:
    name: End-to-end (FOSSBilling 0.8.7 + mock OSIR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: make install
      - run: make e2e
      - run: make doctor
      - name: Container logs on failure
        if: failure()
        run: docker compose --project-directory dev -f dev/docker-compose.yml logs --no-color --tail=200
      - if: always()
        run: make clean

  package:
    name: Release package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dev/scripts/build-release.sh
      - name: The shipped zip contains exactly the adapter and module sources
        run: |
          mkdir -p /tmp/zip && python3 -m zipfile -e dist/osir-fossbilling-registrar-*.zip /tmp/zip
          diff -r --exclude=README.md --exclude=LICENSE --exclude=CHANGELOG.md --exclude=SECURITY.md \
            src/library /tmp/zip/library
          diff -r src/modules /tmp/zip/modules
          test "$(ls /tmp/zip)" = "$(printf 'library\nmodules')"
          mkdir -p /tmp/theme && python3 -m zipfile -e dist/osir-fossbilling-theme-*.zip /tmp/theme
          diff -r --exclude=README.md --exclude=LICENSE theme/osir /tmp/theme/themes/osir
          test "$(ls /tmp/theme)" = "themes"
      - name: Build twice, expect identical bytes
        run: |
          first=$(cat dist/SHA256SUMS)
          dev/scripts/build-release.sh >/dev/null
          test "$first" = "$(cat dist/SHA256SUMS)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/
          retention-days: 14
