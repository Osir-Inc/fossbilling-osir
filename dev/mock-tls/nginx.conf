# TLS terminator for the OSIR mock API. Certificates are generated by scripts/gen-certs.sh
# (private dev CA, never trusted outside this compose project).
server {
    listen 443 ssl;
    server_name api.osir.test;

    ssl_certificate     /certs/server.pem;
    ssl_certificate_key /certs/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://mock-osir-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# A second name on the same mock that answers with a redirect, used by the e2e suite to prove
# the adapter never follows redirects (and so never re-sends X-API-Key to another host).
server {
    listen 443 ssl;
    server_name redirect.osir.test;
    ssl_certificate     /certs/server.pem;
    ssl_certificate_key /certs/server-key.pem;
    return 302 https://api.osir.test$request_uri;
}
